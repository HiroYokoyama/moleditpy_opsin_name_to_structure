name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      moleditpy_ref:
        description: 'MoleditPy branch, tag, or full commit SHA (blank uses repository default)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  MOLEDITPY_REF: ${{ inputs.moleditpy_ref || vars.MOLEDITPY_REF || 'migrate/pyside6-without-openbabel' }}

jobs:
  # -------------------------------------------------------------------------
  # Unit tests. OPSIN itself is stubbed here, so this tier needs no Java.
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: pip install pytest pytest-cov PySide6-Essentials rdkit py2opsin

      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v --tb=short --cov=opsin_name_to_structure --cov-report=term-missing

  # -------------------------------------------------------------------------
  # The tier that really starts OPSIN. GitHub's runners ship a JDK, so this
  # exercises the jar, the batch alignment and the option flags for real --
  # the parts a stub can only pretend to test.
  # -------------------------------------------------------------------------
  test-opsin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install pytest rdkit py2opsin

      - name: Run the real OPSIN tests
        # -rs prints skip reasons: a silently skipped tier looks exactly like a
        # passing one in the log.
        run: python -m pytest tests/test_opsin_real.py -v -rs

      - name: Fail if the real OPSIN tier did not run
        run: |
          python -m pytest tests/test_opsin_real.py -q --no-header -rs > tier.log 2>&1 || true
          cat tier.log
          if grep -q "skipped" tier.log; then
            echo "::error::The real OPSIN tests skipped; this job exists to run them."
            exit 1
          fi

  # -------------------------------------------------------------------------
  # Integration: clones the main app so the API checker validates every host
  # attribute this plugin touches against real MoleditPy source.
  # -------------------------------------------------------------------------
  test-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: pip install pytest PySide6-Essentials rdkit py2opsin

      - name: Clone main MoleditPy application
        shell: bash
        run: |
          git init "../python_molecular_editor"
          git -C "../python_molecular_editor" remote add origin https://github.com/HiroYokoyama/python_molecular_editor.git
          git -C "../python_molecular_editor" fetch --depth 1 origin "$MOLEDITPY_REF"
          git -C "../python_molecular_editor" checkout --detach FETCH_HEAD
          git -C "../python_molecular_editor" log -1 --format="%H %s"

      - name: Run the API checker
        env:
          CI_MAIN_APP_SRC: ${{ github.workspace }}/../python_molecular_editor/moleditpy/src
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_api.py -v -rs

      - name: Fail if the API checker skipped
        env:
          CI_MAIN_APP_SRC: ${{ github.workspace }}/../python_molecular_editor/moleditpy/src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/test_api.py -q --no-header -rs > tier.log 2>&1 || true
          cat tier.log
          if grep -q "skipped" tier.log; then
            echo "::error::The API checker skipped; this job exists to run it."
            exit 1
          fi
